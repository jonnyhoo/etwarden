[package]
name = "etwarden"
version = "0.1.0"
edition = "2021"
description = "Process-level network capture CLI for agent runtime consumption"
license = "MIT"
# Windows-only: ETW APIs not available on other platforms
# Requires administrator privileges at runtime

[[bin]]
name = "etwarden"
path = "src/main.rs"

[package.metadata.cargo-machete]
ignored = ["md-5", "pcap-file"]

[features]
# Feature-gate integration tests requiring admin privileges
integration = []

[dependencies]
# CLI
clap        = { version = "4.5",  features = ["derive"] }
ctrlc       = "3.4"

# Serialization
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = "1.0"

# Passive TLS fingerprint hashing
md-5        = "0.10"
sha2        = "0.10"

# Active HTTPS MITM proxy and decoded HTTP body capture
base64      = "0.22"
brotli      = "8.0"
bytes       = "1.7"
flate2      = "1.1"
http-body-util = "0.1"
http-mitm-proxy = { version = "0.18", default-features = false, features = ["rustls-client"] }
hyper-util  = { version = "0.1", features = ["tokio"] }
rcgen       = { version = "0.14", features = ["pem", "x509-parser"] }
regex       = "1.12"
tokio       = { version = "1.44", features = ["macros", "rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# ETW consumer (high-level safe abstraction over Windows ETW APIs)
ferrisetw   = "1.2"

# Network socket inventory for startup flow attribution
# Keep the dependency key `netstat2` so existing imports stay stable; package uses
# maintained netstat-esr to avoid netstat2's transitive unmaintained `paste`.
netstat2    = { package = "netstat-esr", version = "0.8" }

# Windows API bindings (ETW, process, networking)
windows     = { version = "0.58", features = [
    "Win32_System_Diagnostics_Etw",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_Security",
] }

# Error handling
anyhow      = "1.0"
thiserror   = "1.0"

# Timestamps
chrono      = { version = "0.4",  features = ["serde"] }

# Process name lookup (safe PID→name resolution)
sysinfo     = "0.33"

# pcapng writer
pcap-file   = "2.0"

[dev-dependencies]
# Snapshot tests for JSON schema regression
insta       = { version = "1.39", features = ["json"] }
# Temp files for pcapng writer tests
tempfile    = "3"

# Benchmarks
criterion   = { version = "0.5",  features = ["html_reports"] }

[[bench]]
name    = "event_throughput"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all                 = { level = "deny",  priority = -1 }
pedantic            = { level = "warn",  priority = -1 }
nursery             = { level = "warn",  priority = -1 }
unwrap_used         = "deny"
expect_used         = "allow"
panic               = "deny"
fn_params_excessive_bools = "allow"
struct_excessive_bools    = "allow"
significant_drop_tightening = "allow"
too_many_arguments = "allow"
too_many_lines     = "allow"

[profile.release]
opt-level = 3
strip     = true
lto       = true
codegen-units = 1

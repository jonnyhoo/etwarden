[package]
name = "etwarden"
version = "0.1.0"
edition = "2021"
description = "Process-level network capture CLI for agent runtime consumption"
license = "MIT"
# Windows-only: ETW APIs not available on other platforms
# Requires administrator privileges at runtime

[[bin]]
name = "etwarden"
path = "src/main.rs"

[package.metadata.cargo-machete]
ignored = ["md-5", "pcap-file"]

[features]
# Feature-gate integration tests requiring admin privileges
integration = []

[dependencies]
# CLI
clap        = { version = "4.5",  features = ["derive"] }
ctrlc       = "3.4"

# Serialization
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = "1.0"

# Passive TLS fingerprint hashing
md-5        = "0.10"
sha2        = "0.10"

# Active HTTPS MITM proxy and decoded HTTP body capture
base64      = "0.22"
brotli      = "8.0"
bytes       = "1.7"
encoding_rs = "0.8"
flate2      = "1.1"
http-body-util = "0.1"
http-mitm-proxy = { version = "0.18", default-features = false, features = ["rustls-client"] }
hyper-util  = { version = "0.1", features = ["tokio"] }
prost       = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
rcgen       = { version = "0.14", features = ["pem", "x509-parser"] }
regex       = "1.12"

# Runtime Lua scripting
mlua        = { version = "0.11", features = ["lua54", "vendored"] }
tokio       = { version = "1.44", features = ["macros", "rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0"

# ETW consumer (high-level safe abstraction over Windows ETW APIs)
ferrisetw   = "1.2"

# Network socket inventory for startup flow attribution
# Keep the dependency key `netstat2` so existing imports stay stable; package uses
# maintained netstat-esr to avoid netstat2's transitive unmaintained `paste`.
netstat2    = { package = "netstat-esr", version = "0.8" }

# Windows API bindings (ETW, process, networking)
windows     = { version = "0.57", features = [
    "Win32_System_Diagnostics_Etw",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

# Error handling
anyhow      = "1.0"
thiserror   = "2.0"

# Timestamps
chrono      = { version = "0.4",  features = ["serde"] }

# Process name lookup (safe PID→name resolution)
sysinfo     = "0.33"

# pcapng writer
pcap-file   = "2.0"

# CDP WebSocket client for browse subcommand
tokio-tungstenite = "0.26"
futures-util = "0.3"

[dev-dependencies]
# Snapshot tests for JSON schema regression
insta       = { version = "1.39", features = ["json"] }
# Temp files for pcapng writer tests
tempfile    = "3"

# Benchmarks
criterion   = { version = "0.5",  features = ["html_reports"] }

[[bench]]
name    = "event_throughput"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all                 = { level = "deny",  priority = -1 }
pedantic            = { level = "warn",  priority = -1 }
nursery             = { level = "warn",  priority = -1 }
unwrap_used         = "deny"
expect_used         = "allow"
panic               = "deny"
fn_params_excessive_bools = "allow"
struct_excessive_bools    = "allow"
significant_drop_tightening = "allow"
too_many_arguments = "allow"
too_many_lines     = "allow"
borrow_as_ptr      = "allow"
cast_possible_truncation = "allow"
doc_markdown       = "allow"
missing_panics_doc = "allow"
missing_transmute_annotations = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps  = "allow"

[profile.release]
opt-level = 3
strip     = true
lto       = true
codegen-units = 1

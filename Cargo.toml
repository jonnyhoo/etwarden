[package]
name = "etwarden"
version = "0.1.0"
edition = "2021"
description = "Process-level network capture CLI for agent runtime consumption"
license = "MIT"
# Windows-only: ETW APIs not available on other platforms
# Requires administrator privileges at runtime

[[bin]]
name = "etwarden"
path = "src/main.rs"

[features]
# Feature-gate integration tests requiring admin privileges
integration = []

[dependencies]
# CLI
clap        = { version = "4.5",  features = ["derive"] }

# Serialization
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = "1.0"

# ETW consumer (high-level safe abstraction over Windows ETW APIs)
ferrisetw   = "1.2"

# Windows API bindings (ETW, process, networking)
windows     = { version = "0.58", features = [
    "Win32_System_Diagnostics_Etw",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_Security",
] }

# Error handling
anyhow      = "1.0"
thiserror   = "1.0"

# Timestamps
chrono      = { version = "0.4",  features = ["serde"] }

# pcapng writer
pcap-file   = "2.0"

[dev-dependencies]
# Snapshot tests for JSON schema regression
insta       = { version = "1.39", features = ["json"] }

# Benchmarks
criterion   = { version = "0.5",  features = ["html_reports"] }

[[bench]]
name    = "event_throughput"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all         = { level = "deny",  priority = -1 }
pedantic    = { level = "warn",  priority = -1 }
nursery     = { level = "warn",  priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic       = "deny"

[profile.release]
opt-level = 3
strip     = true
lto       = true
codegen-units = 1
